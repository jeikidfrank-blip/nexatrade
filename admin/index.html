<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090d12">
    <title>NexaTask | Admin Login</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="../nexatask-icon-32.png">
    <link rel="apple-touch-icon" href="../nexatask-icon-180.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <script src="admin.js" defer></script>
</head>

<body>
    <main class="login-page">
        <section class="login-card">
            <div class="brand">
                <div class="brand-icon">N</div>
                <div>
                    <h1>NexaTask</h1>
                    <p>ADMINISTRATION PORTAL</p>
                </div>
            </div>

            <div class="login-heading">
                <span class="eyebrow">SECURE ACCESS</span>
                <h2>Welcome back</h2>
                <p>Sign in to manage your NexaTask platform.</p>
            </div>

            <form id="adminLoginForm">
                <label for="email">Administrator email</label>
                <input type="email" id="email" placeholder="Enter admin email" autocomplete="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"
                    required>

                <button type="submit" id="loginButton">
                    Sign in to dashboard
                </button>

                <p id="loginMessage" class="message" role="status"></p>
            </form>

            <div class="security-note">
                <span>🔒</span>
                Protected administrator access
            </div>

            <a href="../index.html" class="back-link">← Back to NexaTask</a>
        </section>
    </main>
</body>

</html>
